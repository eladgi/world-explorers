<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>מגלי עולם – משחק גיאוגרפיה</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.3.2/css/flag-icons.min.css" />
<link rel="stylesheet" href="css/style.css?v=29" />
</head>
<body class="at-menu">

<header class="app-header">
  <button id="btn-home" class="btn-home" hidden>🏠<span class="btn-home-label">תפריט</span></button>
  <h1 class="app-title"><span class="app-globe">🌍</span><span class="app-wordmark">מגלי עולם</span></h1>
  <div class="header-spacer"></div>
  <div class="header-actions">
    <button id="btn-stars" class="btn-stars" aria-label="הדרכון שלי">⭐ <span id="stars-count">0</span></button>
    <button id="btn-mute" class="btn-icon" aria-label="השתקת צלילים">🔊</button>
    <button id="btn-help" class="btn-icon" aria-label="הדרכה">?</button>
  </div>
</header>

<main id="app">

  <section id="view-menu" class="view">
    <div class="menu-head">
      <div class="menu-head-text">
        <h2 class="menu-title">מה נגלה היום?</h2>
        <p class="menu-intro">בחרו משחק ותתחילו לאסוף מדינות לדרכון שלכם.</p>
      </div>
      <button class="passport-cta" id="menu-passport-cta">
        <span class="passport-cta-emoji">🎒</span>
        <span class="passport-cta-body">
          <span class="passport-cta-title">הדרכון שלי</span>
          <span class="passport-cta-sub" id="menu-passport-line">0 מתוך 179 מדינות הושלמו</span>
        </span>
        <span class="passport-cta-chevron">‹</span>
      </button>
    </div>

    <div class="mode-grid">
      <button class="mode-card" data-mode="explore">
        <span class="mode-emoji">🔎</span>
        <span class="mode-name">גלו את העולם</span>
        <span class="mode-desc">לחצו על מדינה וגלו עובדות, שכנות ודגל</span>
        <span class="mode-tag">בלי ניקוד · חקר חופשי</span>
      </button>
      <button class="mode-card" data-mode="guess">
        <span class="mode-emoji">🎯</span>
        <span class="mode-name">נחשו את המדינה</span>
        <span class="mode-desc">מקבלים שם ודגל – מוצאים אותה על המפה</span>
        <span class="mode-tag">10 שאלות · ⭐ כוכבים</span>
      </button>
      <button class="mode-card" data-mode="shapeguess">
        <span class="mode-emoji">🧭</span>
        <span class="mode-name">נחשו לפי הצורה</span>
        <span class="mode-desc">רק קווי המתאר – מזהים ומוצאים על המפה</span>
        <span class="mode-tag">אתגר · ⭐ כוכבים</span>
      </button>
      <button class="mode-card" data-mode="flagmatch">
        <span class="mode-emoji">🧩</span>
        <span class="mode-name">התאימו דגלים</span>
        <span class="mode-desc">כל דגל אל המדינה שלו, בלי גרירה</span>
        <span class="mode-tag">4–8 זוגות · ⭐ כוכבים</span>
      </button>
      <button class="mode-card" data-mode="capitalmatch">
        <span class="mode-emoji">🏙️</span>
        <span class="mode-name">התאימו בירות</span>
        <span class="mode-desc">כל מדינה אל עיר הבירה שלה</span>
        <span class="mode-tag">4–8 זוגות · ⭐ כוכבים</span>
      </button>
      <button class="mode-card" data-mode="trivia">
        <span class="mode-emoji">❓</span>
        <span class="mode-name">חידון גיאוגרפיה</span>
        <span class="mode-desc">שאלות על דגלים, בירות ועובדות מפתיעות</span>
        <span class="mode-tag">10 שאלות · ⭐ כוכבים</span>
      </button>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-value" id="stat-stars">0</div><div class="stat-label">⭐ כוכבים שאספתם</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-mastered">0</div><div class="stat-label">🏅 מדינות שהשלמתם</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-streak">0</div><div class="stat-label">🔥 הרצף הארוך שלכם</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-total">179</div><div class="stat-label">🌍 מדינות במשחק</div></div>
    </div>
  </section>

  <section id="view-setup" class="view" hidden>
    <div class="setup-head">
      <span class="setup-emoji" id="setup-emoji"></span>
      <div>
        <h2 id="setup-title"></h2>
        <p id="setup-subtitle" class="setup-subtitle"></p>
      </div>
    </div>
    <p class="setup-label">איפה משחקים?</p>
    <div id="continent-chips" class="option-grid continents" role="group" aria-label="בחירת יבשת"></div>
    <p class="setup-label">רמת קושי</p>
    <div id="difficulty-chips" class="option-grid difficulties" role="group" aria-label="בחירת רמת קושי"></div>
    <div id="practice-toggle-wrap" hidden></div>
  </section>

  <section id="view-explore" class="view" hidden></section>
  <section id="view-guess" class="view" hidden></section>
  <section id="view-shapeguess" class="view" hidden></section>
  <section id="view-flagmatch" class="view" hidden></section>
  <section id="view-capitalmatch" class="view" hidden></section>
  <section id="view-trivia" class="view" hidden></section>
  <section id="view-passport" class="view" hidden></section>

</main>

<div class="setup-cta-bar" id="setup-cta-bar" hidden>
  <button id="setup-start" class="btn-primary">בואו נתחיל! ▶</button>
</div>

<footer class="app-footer">
  <small>מפת העולם: מבוססת על נתוני Natural Earth (רישיון Public Domain) · דגלים: flag-icons (רישיון MIT) · מספרי האוכלוסייה הם קירוב</small>
</footer>

<script src="assets/world-map.js?v=29"></script>
<script src="js/data/countries.js?v=29"></script>
<script src="js/worldmap.js?v=29"></script>
<script src="js/audio.js?v=29"></script>
<script src="js/progress.js?v=29"></script>
<script src="js/polish.js?v=29"></script>
<script src="js/tutorial.js?v=29"></script>
<script src="js/explore.js?v=29"></script>
<script src="js/guess.js?v=29"></script>
<script src="js/shapeguess.js?v=29"></script>
<script src="js/flagmatch.js?v=29"></script>
<script src="js/capitalmatch.js?v=29"></script>
<script src="js/trivia.js?v=29"></script>
<script src="js/passport.js?v=29"></script>
<script src="js/menu.js?v=29"></script>
</body>
</html>
